<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лотерея-гонки — Mark Grozny</title>
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="lottery-play.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --field-w: 900px;
      --field-h: 700px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--widget-font);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .page-top {
      width: var(--field-w);
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 4px 8px;
      flex-shrink: 0;
    }

    .page-top a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .page-top a:hover { color: #fff; }

    .page-top span {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .scale-wrap {
      width: var(--field-w);
      height: var(--field-h);
      max-width: 100%;
      flex-shrink: 0;
      transform-origin: top center;
    }

    .lottery {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-panel);
      width: var(--field-w);
      height: var(--field-h);
      display: flex;
      flex-direction: column;
    }

    .lottery-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, transparent 12%, transparent 88%, rgba(0, 0, 0, 0.65) 100%),
        linear-gradient(rgba(10, 12, 16, 0.75), rgba(6, 8, 12, 0.88)),
        url("../icons/sherp.png") center / cover no-repeat;
      pointer-events: none;
    }

    .lottery-inner {
      position: relative;
      z-index: 1;
      padding: 22px 28px 18px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .brand img {
      height: 20px;
      width: auto;
      opacity: 0.85;
    }

    .title {
      text-align: center;
      font-size: 2.35rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.05em;
      line-height: 1;
      margin: 0 0 12px;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      flex-shrink: 0;
    }

    .badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .badge {
      padding: 0.35rem 1.1rem;
      border-radius: 3px;
      background: linear-gradient(180deg, #62e86f 0%, #2db83d 100%);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 2px 10px rgba(45, 184, 61, 0.45);
    }

    .stage-nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .stage-btn {
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.28);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.72rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.5rem 0.85rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .stage-btn:hover {
      border-color: rgba(255, 170, 0, 0.5);
      color: #fff;
    }

    .stage-btn.active {
      background: linear-gradient(180deg, rgba(255, 140, 0, 0.4), rgba(255, 100, 0, 0.22));
      border-color: rgba(255, 170, 0, 0.7);
      color: #fff;
    }

    .stage-title {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      font-style: italic;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .grid-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0 4px;
    }

    .grid {
      display: grid;
      gap: 0;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      max-width: 820px;
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      max-width: 840px;
    }

    .grid.cols-5 {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      max-width: 844px;
    }

    .grid.cols-3 .cell:nth-child(3n) { border-right: none; }
    .grid.cols-4 .cell:nth-child(4n) { border-right: none; }
    .grid.cols-5 .cell:nth-child(5n) { border-right: none; }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
      padding: 10px 12px 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .label {
      display: block;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-style: italic;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .stage-1 .label { font-size: 0.88rem; }
    .stage-2 .label { font-size: 0.78rem; margin-bottom: 6px; }
    .stage-3 .label { font-size: 0.68rem; margin-bottom: 5px; }

    .ticket {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-height: 100%;
      aspect-ratio: 1;
      margin: 0 auto;
      align-self: center;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(145deg, #ff6f00 0%, #ffab00 44%, #ff8500 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -3px 6px rgba(0, 0, 0, 0.22),
        0 5px 14px rgba(0, 0, 0, 0.42);
    }

    .stage-1 .ticket { max-width: min(100%, 240px); }
    .stage-2 .ticket { max-width: min(100%, 175px); border-radius: 10px; }
    .stage-3 .ticket { max-width: min(100%, 132px); border-radius: 9px; }

    .stage-1 .q { font-size: 4.5rem; }
    .stage-2 .q { font-size: 3.2rem; }
    .stage-3 .q { font-size: 2.35rem; }

    .ticket-closed {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q {
      font-weight: 900;
      font-style: italic;
      color: #fff;
      line-height: 1;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .coming-soon {
      text-align: center;
      margin-top: 10px;
      font-size: 0.72rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.38);
      flex-shrink: 0;
    }

    /* OBS / точный размер 900×700 */
    body.obs-mode {
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    body.obs-mode .page-top { display: none; }

    @media (max-width: 920px) {
      .scale-wrap {
        transform: scale(calc((100vw - 20px) / var(--field-w)));
        height: calc(var(--field-h) * ((100vw - 20px) / var(--field-w)));
      }
    }
  </style>
</head>
<body>
  <div class="page-top">
    <a href="../index.html">← Mark Grozny</a>
    <span>900×700</span>
  </div>

  <div class="scale-wrap">
    <section class="lottery stage-1" id="lottery" aria-label="Лотерея-гонки">
      <div class="lottery-bg" aria-hidden="true"></div>

      <div class="lottery-inner">
        <div class="brand">
          <img src="../icons/logo.png" alt="" onerror="this.style.display='none'">
          Mark Grozny
        </div>

        <h1 class="title">ЛОТЕРЕЯ-ГОНКИ</h1>

        <div class="badge-wrap">
          <span class="badge">Бесплатно</span>
        </div>

        <nav class="stage-nav" aria-label="Этапы">
          <button type="button" class="stage-btn active" data-stage="1">Этап 1 · 3×3</button>
          <button type="button" class="stage-btn" data-stage="2">Этап 2 · 4×4</button>
          <button type="button" class="stage-btn" data-stage="3">Этап 3 · 5×5</button>
        </nav>

        <p class="stage-title" id="stageTitle">Этап 1 — сетка 3×3</p>
        <p class="scratch-hint">Стирай билет мышью или пальцем</p>

        <div class="grid-wrap">
          <div class="grid cols-3" id="ticketGrid" role="list"></div>
        </div>

        <p class="game-status" id="gameStatus"></p>
        <div class="lottery-tools">
          <button type="button" class="tool-btn" id="resetGameBtn">Новая игра</button>
        </div>
      </div>
    </section>
  </div>

  <script src="lottery.js"></script>
</body>
</html>
